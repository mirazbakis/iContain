<!doctype html>
<!-- iContain ad template, in the site's blueprint style. scripts/render-ads.sh renders
     it at three sizes: ?f=og (1200x630), ?f=square (1080x1080), ?f=story (1080x1920). -->
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: #0c0e18;
    background-color: #f3f4f7;
    background-image: linear-gradient(rgba(12,14,24,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(12,14,24,.05) 1px, transparent 1px);
    background-size: 32px 32px;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: #8a8fa0; }
  .blue { color: #2f5fe0; }
  .ad { position: relative; width: 100%; height: 100%; }
  .copy { position: absolute; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: .5em; font-weight: 750; letter-spacing: -.02em; }
  .brand img { border-radius: 22%; }
  .brand .v { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 500; font-size: .45em; color: #8a8fa0; border: 1px solid #d9dce5; border-radius: 5px; padding: .1em .4em; }
  h1 { font-weight: 850; letter-spacing: -.05em; line-height: .96; }
  p { color: #4a4f60; line-height: 1.45; }
  .rule { height: 2px; background: #0c0e18; }
  .facts { display: flex; gap: 1.6em; }
  .facts div { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #8a8fa0; }
  .facts b { display: block; font-family: -apple-system, sans-serif; color: #0c0e18; font-size: 1.7em; letter-spacing: -.02em; }
  .shot { position: absolute; aspect-ratio: 1206/2622; background: #0c0e18; box-shadow: 0 40px 80px -40px rgba(12,14,40,.6); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .note { position: absolute; display: flex; align-items: center; gap: .6em; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #4a4f60; white-space: nowrap; }
  .note::before { content: ""; width: 3.2em; height: 1px; background: #2f5fe0; }
  .note b { color: #0c0e18; }
  .url { position: absolute; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #0c0e18; font-weight: 600; }

  /* 1200x630 */
  .og .copy { left: 72px; top: 70px; width: 660px; gap: 22px; }
  .og .brand { font-size: 30px; } .og .brand img { width: 52px; }
  .og h1 { font-size: 80px; } .og p { font-size: 23px; max-width: 600px; } .og .mono { font-size: 15px; }
  .og .facts { font-size: 15px; }
  .og .shot { width: 250px; right: 120px; top: 60px; padding: 9px; border-radius: 40px; }
  .og .shot img { border-radius: 32px; }
  .og .note { display: none; }
  .og .url { left: 72px; bottom: 40px; font-size: 16px; }

  /* 1080x1080 */
  .square .copy { left: 80px; top: 80px; width: 560px; gap: 26px; }
  .square .brand { font-size: 34px; } .square .brand img { width: 60px; }
  .square h1 { font-size: 96px; } .square p { font-size: 27px; } .square .mono { font-size: 16px; }
  .square .facts { font-size: 17px; }
  .square .shot { width: 330px; right: 90px; top: 150px; padding: 11px; border-radius: 50px; }
  .square .shot img { border-radius: 40px; }
  .square .note { font-size: 15px; display: none; }
  .square .url { left: 80px; bottom: 70px; font-size: 20px; }

  /* 1080x1920 */
  .story .copy { left: 90px; right: 90px; top: 150px; gap: 34px; }
  .story .brand { font-size: 46px; } .story .brand img { width: 84px; }
  .story h1 { font-size: 150px; } .story p { font-size: 38px; } .story .mono { font-size: 22px; }
  .story .facts { font-size: 22px; }
  .story .shot { width: 470px; left: 50%; transform: translateX(-50%); bottom: -260px; padding: 15px; border-radius: 70px; }
  .story .shot img { border-radius: 56px; }
  .story .note { display: none; }
  .story .url { right: 90px; top: 165px; font-size: 22px; }
</style></head>
<body>
<div class="ad" id="ad">
  <div class="copy">
    <div class="brand"><img src="../site/assets/icon.png" alt="">iContain<span class="v">v0.1</span></div>
    <div class="mono"><span class="blue">●</span> Free · Open source · iOS 18+</div>
    <h1>Run any app<br>inside <span class="blue">one</span> app.</h1>
    <p>Including iOS Simulator builds. Test as any iPhone or iPad, anywhere in the world.</p>
    <div class="rule"></div>
    <div class="facts"><div><b>9</b>test devices</div><div><b>1</b>App ID</div><div><b>MIT</b>license</div></div>
  </div>
  <div class="shot"><img src="../site/assets/apps.jpg" alt=""></div>
  <div class="note" style="top: 205px"><b>Probe</b> · Simulator build</div>
  <div class="note" style="top: 235px">converted → iOS arm64</div>
  <div class="note" style="top: 265px">signed · ready to open</div>
  <div class="url">mirazbakis.github.io/iContain</div>
</div>
<script>
  const f = new URLSearchParams(location.search).get("f") || "og";
  document.getElementById("ad").classList.add(f);
  // The link card keeps the sentence short so the screenshot fits beside it.
  if (f === "og") document.querySelector(".facts").remove();
</script>
</body></html>
