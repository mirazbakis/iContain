# Keeps the workflow actions and Rust dependencies current. Rust updates are grouped
# into one weekly pull request so CI checks them together, and limited to patch
# releases: most of these crates are 0.x, where a minor release (0.4 → 0.5) can break
# the build. Bigger upgrades are done by hand, alongside AltLoad's.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
